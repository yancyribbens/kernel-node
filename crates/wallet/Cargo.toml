[package]
name = "wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
silentpayments = { version = "0.5", features = ["receiving", "encode", "sending"] }
# bitcoin = { version = "0.32.8", features = ["rand-std"] }
bitcoin = { git = "https://github.com/tcharding/rust-bitcoin.git", rev = "5aa0224aedd1785122f8c9649ad44b55232c56ee", features = ["compat"] }
bitcoinkernel = "0.2"
log = "0.4"
bitcoin-coin-selection = { path = "../../../rust-bitcoin-coin-selection", features = ["rand"] }

[dev-dependencies]
tempfile = "3"
